<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#fafbfc"/>

  <!-- Decorative blobs -->
  <circle cx="1100" cy="80" r="320" fill="url(#blobOrange)" opacity=".07"/>
  <circle cx="100" cy="560" r="260" fill="url(#blobBlue)" opacity=".07"/>

  <!-- Left orange accent bar -->
  <rect x="80" y="200" width="6" height="230" rx="3" fill="#ff6b1a"/>

  <!-- Logo mark -->
  <rect x="80" y="80" width="72" height="72" rx="18" fill="#0a0a0e"/>
  <path d="M131.3 95.3C121 95.3 110 102.5 104 110.5c-4.9 6.6-7 14-7 19 0 0 13-2.4 22-11.4C127 110.1 131.3 95.3 131.3 95.3z" fill="#ff6b1a"/>
  <line x1="119" y1="107" x2="97" y2="129" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round"/>
  <line x1="115" y1="114" x2="107" y2="114" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round" opacity=".75"/>

  <!-- Name -->
  <text x="114" y="225" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="700" fill="#0a0a0e" letter-spacing="-2">Amr Ebrahim Kamal</text>

  <!-- Role pills row -->
  <!-- Full-Stack Developer pill (orange) -->
  <rect x="114" y="250" width="290" height="44" rx="10" fill="#fff1e8"/>
  <text x="134" y="278" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#ff6b1a">Full-Stack Developer</text>

  <!-- Business Analyst pill (blue) -->
  <rect x="416" y="250" width="240" height="44" rx="10" fill="#ecf0ff"/>
  <text x="436" y="278" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#2553f5">Business Analyst</text>

  <!-- Automation Engineer pill (dark) -->
  <rect x="668" y="250" width="290" height="44" rx="10" fill="#f5f6f8"/>
  <text x="688" y="278" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#3a3d4a">Automation Engineer</text>

  <!-- Divider -->
  <rect x="114" y="322" width="840" height="1.5" fill="#e8eaf0"/>

  <!-- Bio -->
  <text x="114" y="368" font-family="Arial, sans-serif" font-size="24" fill="#6e7280">Building real-world web apps, automation pipelines &amp; e-commerce</text>
  <text x="114" y="402" font-family="Arial, sans-serif" font-size="24" fill="#6e7280">platforms for paying clients — based in Cairo, Egypt.</text>

  <!-- Bottom status row -->
  <circle cx="130" cy="466" r="8" fill="#16a34a"/>
  <text x="150" y="472" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0a0a0e">Available for opportunities</text>

  <!-- URL -->
  <text x="114" y="550" font-family="Arial, sans-serif" font-size="20" fill="#9ca0ac">amr-ebrahim-kamal.vercel.app</text>

  <!-- Right accent block -->
  <rect x="1040" y="0" width="160" height="630" fill="url(#sideGrad)" opacity=".5"/>

  <defs>
    <radialGradient id="blobOrange" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6b1a"/>
      <stop offset="100%" stop-color="#ff6b1a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2553f5"/>
      <stop offset="100%" stop-color="#2553f5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sideGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff1e8" stop-opacity="0"/>
      <stop offset="100%" stop-color="#fff1e8"/>
    </linearGradient>
  </defs>
</svg>
